[project]
name = "anki-cloze"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "google-auth>=2.29",
  "google-api-python-client>=2.120",
  "requests>=2.31",
  "genanki>=0.13",
  "lameenc>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
anki-cloze = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
